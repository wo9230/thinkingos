        description: >-
          Person whose speech or authored statement is being attributed. Null
          is valid for non-speech records or when attribution is genuinely unknown.
        oneOf:
          - $ref: "#/$defs/PersonRef"
          - type: "null"
      attribution_status:
        type: string
        enum:
          - explicit
          - inferred
          - not_applicable
          - ambiguous
          - unknown
      attribution_ambiguity:
        description: >-
          Records overlapping speech, uncertain diarization, paraphrase, or
          another attribution limit. Required text is enforced when status is
          ambiguous or unknown.
        $ref: "#/$defs/NullableString"
      observed_at:
        $ref: "#/$defs/NullableDateOrDateTime"
      epistemic_status:
        type: string
        enum:
          - asserted
          - corroborated
          - contested
          - refuted
          - outdated
      confidence:
        $ref: "#/$defs/Confidence"
      relevance:
        type: string
        enum:
          - critical
          - high
          - medium
          - low
      supports_hypothesis_ids:
        $ref: "#/$defs/StringList"
      contradicts_hypothesis_ids:
        $ref: "#/$defs/StringList"
      falsified_when:
        $ref: "#/$defs/StringList"
      review_by:
        $ref: "#/$defs/NullableDateOrDateTime"
      advisor_incentive_id:
        $ref: "#/$defs/NullableString"
      user_confirmed:
        type: boolean
    allOf:
      - if:
          properties:
            attribution_status:
              enum:
                - ambiguous
                - unknown
          required:
            - attribution_status
        then:
          properties:
            attribution_ambiguity:
              type: string
              minLength: 1
          required:
            - attribution_ambiguity
      - if:
          properties:
            evidence_form:
              const: testimony
            attribution_status:
              enum:
                - explicit
                - inferred
          required:
            - evidence_form
            - attribution_status
        then:
          properties:
            speaker:
              $ref: "#/$defs/PersonRef"
