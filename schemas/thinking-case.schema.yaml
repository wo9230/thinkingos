          type: number
  Threshold:
    type: object
    additionalProperties: false
    required:
      - threshold_id
      - version
      - applies_to
      - operator
      - value
      - unit
      - denominator
      - measurement_window
      - segment_context
      - decision_consequence
      - revision_rule
      - provenance_type
      - source_claim_ids
      - rationale
      - confidence
      - status
      - approved_by
      - approved_at
      - review_by
      - supersedes_threshold_id
      - sensitivity_notes
    properties:
      threshold_id:
        $ref: "#/$defs/NonEmptyString"
      version:
        description: >-
          Monotonic version used by DecisionSnapshot. Threshold corrections
          create a new version rather than editing the locked version in place.
        type: integer
        minimum: 1
      applies_to:
        $ref: "#/$defs/NonEmptyString"
      operator:
        type: string
        enum:
          - gte
          - lte
          - gt
          - lt
          - eq
          - between
          - change_by
          - qualitative
      value:
        $ref: "#/$defs/ThresholdValue"
      unit:
        $ref: "#/$defs/NullableString"
      denominator:
        description: >-
          The population or exposure base, such as 'per eligible attempt',
          'among the defined cohort', or 'per measurement unit'. Null is allowed
          only when the metric genuinely has no denominator.
        $ref: "#/$defs/NullableString"
      measurement_window:
        $ref: "#/$defs/NonEmptyString"
      segment_context:
        description: "Named audience, channel, offer, and relevant operating context."
        $ref: "#/$defs/NonEmptyString"
      decision_consequence:
        description: "What decision changes when this threshold is met or missed."
        $ref: "#/$defs/NonEmptyString"
      revision_rule:
        description: >-
          Prospective rule for revising this threshold when the baseline,
          denominator, segment, or capacity changes; forbids silent hindsight edits.
        $ref: "#/$defs/NonEmptyString"
      provenance_type:
        type: string
        enum:
          - user_commitment
          - historical_baseline
          - experiment_baseline
          - external_benchmark
          - advisor_recommendation
          - model_suggestion
          - regulatory_requirement
      source_claim_ids:
        $ref: "#/$defs/StringList"
      rationale:
        $ref: "#/$defs/NonEmptyString"
      confidence:
        $ref: "#/$defs/Confidence"
      status:
        type: string
        enum:
          - provisional
          - approved
          - rejected
          - replaced
      approved_by:
        oneOf:
          - $ref: "#/$defs/PersonRef"
          - type: "null"
      approved_at:
        $ref: "#/$defs/NullableDateTime"
      review_by:
        $ref: "#/$defs/NullableDateOrDateTime"
      supersedes_threshold_id:
        $ref: "#/$defs/NullableString"
      sensitivity_notes:
        $ref: "#/$defs/NonEmptyString"
