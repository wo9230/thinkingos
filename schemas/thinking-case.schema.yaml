      comparison:
        type: array
        items:
          $ref: "#/$defs/CriterionScore"
      selected_option_id:
        $ref: "#/$defs/NullableString"
      current_best_judgment:
        $ref: "#/$defs/NullableString"
      confidence:
        oneOf:
          - $ref: "#/$defs/Confidence"
          - type: "null"
      key_basis_claim_ids:
        $ref: "#/$defs/StringList"
      strongest_counterargument:
        $ref: "#/$defs/NullableString"
      change_mind_conditions:
        $ref: "#/$defs/StringList"
      predictions:
        type: array
