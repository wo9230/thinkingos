        then:
          anyOf:
            - properties:
                options:
                  minItems: 2
            - properties:
                option_set_exception:
                  $ref: "#/$defs/OptionSetException"
  ThresholdVersionRef:
    type: object
    additionalProperties: false
    required:
      - threshold_id
      - version
    properties:
      threshold_id:
        $ref: "#/$defs/NonEmptyString"
      version:
        type: integer
        minimum: 1
  DecisionSnapshot:
    description: >-
      Immutable, retrievable payload frozen before ACTING. Corrections create a
      new Case or snapshot version and retain the prior payload; the application
      validator MUST canonicalize the payload, verify payload_sha256 equals the
      Audit hash, resolve every reference, and prohibit in-place mutation.
    type: object
    additionalProperties: false
    required:
      - status
      - snapshot_id
      - version
      - decision_id
      - judgment
      - confidence
      - prediction_ids
      - active_threshold_versions
      - tradeoffs
      - now_action_ids
      - locked_at
      - payload_sha256
      - supersedes_snapshot_id
      - correction_reason
    properties:
      status:
        type: string
        enum:
          - not_created
          - draft
          - locked
          - superseded
      snapshot_id:
        $ref: "#/$defs/NullableString"
      version:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      decision_id:
        $ref: "#/$defs/NullableString"
      judgment:
        $ref: "#/$defs/NullableString"
      confidence:
        oneOf:
          - $ref: "#/$defs/Confidence"
          - type: "null"
      prediction_ids:
        $ref: "#/$defs/StringList"
      active_threshold_versions:
        type: array
        items:
          $ref: "#/$defs/ThresholdVersionRef"
      tradeoffs:
        $ref: "#/$defs/StringList"
      now_action_ids:
        $ref: "#/$defs/StringList"
      locked_at:
        $ref: "#/$defs/NullableDateTime"
      payload_sha256:
        oneOf:
          - type: string
            pattern: "^[a-f0-9]{64}$"
          - type: "null"
      supersedes_snapshot_id:
        $ref: "#/$defs/NullableString"
      correction_reason:
        $ref: "#/$defs/NullableString"
    allOf:
      - if:
          properties:
            status:
              enum:
                - locked
                - superseded
          required:
            - status
        then:
          properties:
            snapshot_id:
              type: string
              minLength: 1
            version:
              type: integer
              minimum: 1
            decision_id:
              type: string
              minLength: 1
            judgment:
              type: string
              minLength: 1
            confidence:
              type: number
              minimum: 0
              maximum: 1
            prediction_ids:
              minItems: 1
            active_threshold_versions:
              minItems: 1
            tradeoffs:
              minItems: 1
            now_action_ids:
              minItems: 1
            locked_at:
              $ref: "#/$defs/ISODateTime"
            payload_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
