        $ref: "#/$defs/NullableString"
      decision_owner:
        $ref: "#/$defs/CaseOwnerRef"
      criteria:
        type: array
        items:
          $ref: "#/$defs/DecisionCriterion"
      options:
        type: array
        items:
          $ref: "#/$defs/DecisionOption"
      option_set_exception:
        oneOf:
          - $ref: "#/$defs/OptionSetException"
