        $ref: "#/$defs/TeachBackElement"
      chosen_judgment:
        $ref: "#/$defs/TeachBackElement"
      rejected_alternative:
        $ref: "#/$defs/TeachBackElement"
      principal_tradeoff:
        $ref: "#/$defs/TeachBackElement"
      key_thresholds:
        $ref: "#/$defs/TeachBackElement"
      strongest_countercase:
