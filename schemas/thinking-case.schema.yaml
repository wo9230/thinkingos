        $ref: "#/$defs/StringList"
  ClarityGaps:
    type: object
    additionalProperties: false
    required:
      - triage_status
      - assessed_at
      - gaps
      - gate_decision
      - gate_rationale
      - route_status
      - route_handling
      - next_state
      - user_confirmed
    properties:
      triage_status:
        type: string
        enum:
          - not_assessed
          - incomplete
          - ready
          - blocked
      assessed_at:
        $ref: "#/$defs/NullableDateTime"
      gaps:
        type: array
        items:
          $ref: "#/$defs/ClarityGap"
      gate_decision:
        description: >-
          Clarity Triage routing decision inside DRAFT; this is a gate result,
          not a persistent case status. not_assessed is an initialization
          sentinel, not a sixth route; completed triage chooses one of the five
          substantive routes below.
        type: string
        enum:
          - not_assessed
          - full_case
          - evidence_first
          - small_reversible_action
          - no_framework_needed
          - cannot_proceed
      gate_rationale:
        $ref: "#/$defs/NonEmptyString"
      route_status:
        description: >-
          Lifecycle state of the selected DRAFT-internal route. A route can be
          selected before its evidence action, reversible action, direct answer,
          or blocker disposition has been handled.
        type: string
        enum:
          - not_selected
          - selected
          - in_progress
          - ready_for_transition
          - completed_in_draft
          - blocked
      route_handling:
        description: >-
          Concrete handling and rerun rule for this route. It is not a hidden
          durable Case status and must not be used to bypass a Gate.
        $ref: "#/$defs/NonEmptyString"
      next_state:
        description: >-
          Only full_case may select CLARIFYING. All other G-01 routes stay in
          DRAFT until they close there or their evidence/blocker changes and
          Clarity Triage is rerun.
        type: string
        enum:
          - DRAFT
          - CLARIFYING
      user_confirmed:
        type: boolean
    allOf:
      - if:
          properties:
            gate_decision:
              const: not_assessed
          required:
            - gate_decision
        then:
          properties:
            route_status:
              const: not_selected
            next_state:
              const: DRAFT
      - if:
          properties:
            gate_decision:
              const: full_case
          required:
            - gate_decision
        then:
          properties:
            next_state:
              const: CLARIFYING
            route_status:
              enum:
                - selected
                - ready_for_transition
      - if:
          properties:
            gate_decision:
              enum:
                - evidence_first
                - small_reversible_action
                - no_framework_needed
                - cannot_proceed
          required:
            - gate_decision
        then:
          properties:
            next_state:
              const: DRAFT
      - if:
          properties:
            gate_decision:
              const: evidence_first
          required:
            - gate_decision
        then:
          properties:
            route_status:
              enum:
                - selected
                - in_progress
                - completed_in_draft
      - if:
          properties:
            gate_decision:
              const: small_reversible_action
          required:
            - gate_decision
        then:
          properties:
            route_status:
              enum:
                - selected
                - in_progress
                - completed_in_draft
      - if:
          properties:
            gate_decision:
              const: no_framework_needed
          required:
            - gate_decision
        then:
          properties:
            route_status:
              enum:
                - selected
                - completed_in_draft
      - if:
          properties:
            gate_decision:
              const: cannot_proceed
          required:
            - gate_decision
        then:
          properties:
            route_status:
              const: blocked
  EvidenceClaim:
    type: object
