      next_action:
        $ref: "#/$defs/NullableString"
      due_at:
        $ref: "#/$defs/NullableDateOrDateTime"
      status:
        type: string
        enum:
          - open
          - monitoring
          - resolved
          - accepted_unknown
          - deferred
      disposition:
        type: string
        enum:
          - not_set
          - evidence_action
          - decision_date
          - accepted_uncertainty
          - carried_forward
          - resolved
      decision_at:
        $ref: "#/$defs/NullableDateOrDateTime"
