$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://thinkingos.local/schemas/thinking-case.schema.yaml"
title: "ThinkingOS ThinkingCase"
description: >-
  ThinkingOS V0.2 structured case contract. The contract preserves what was
  known, inferred, decided, attempted, and learned at each point in time. All
  top-level sections exist from DRAFT onward; section-level status and nulls
  represent work not yet completed. Confirmed decisions must be versioned,
  never rewritten with hindsight.
$comment: >-
  JSON Schema validates one snapshot and individual transition records. The
  application validator MUST additionally enforce referential integrity,
  exactly one primary Track, state-history continuity, monotonic versions,
  Gate-to-transition correspondence, semantic Teach-back coverage, copied-text
  or assent-only detection, immutable Decision Snapshot hashes, and whether an
  unresolved blocker whose blocking_phase is the current or an earlier phase
  prevents the requested Gate transition.
type: object
additionalProperties: false
required:
  - schema_version
  - identity
  - context
  - success_contract
  - clarity_gaps
  - evidence_ledger
  - competing_hypotheses
  - question_answer_trace
  - problem_model
  - decision
  - action_plan
  - decision_snapshot
  - threshold_provenance
  - teach_back
  - unresolved_issues
  - review
  - advisor_incentives
  - audit
properties:
  schema_version:
    type: string
    const: "0.2.0"
  identity:
    $ref: "#/$defs/Identity"
  context:
    $ref: "#/$defs/Context"
  success_contract:
    $ref: "#/$defs/SuccessContract"
  clarity_gaps:
    $ref: "#/$defs/ClarityGaps"
  evidence_ledger:
    type: array
    items:
      $ref: "#/$defs/EvidenceClaim"
  competing_hypotheses:
    type: array
    items:
      $ref: "#/$defs/Hypothesis"
  question_answer_trace:
    type: array
    items:
      $ref: "#/$defs/QuestionAnswerTurn"
  problem_model:
    $ref: "#/$defs/ProblemModel"
  decision:
    $ref: "#/$defs/Decision"
  action_plan:
    $ref: "#/$defs/ActionPlan"
  decision_snapshot:
    $ref: "#/$defs/DecisionSnapshot"
  threshold_provenance:
    type: array
    items:
      $ref: "#/$defs/Threshold"
  teach_back:
    $ref: "#/$defs/TeachBack"
  unresolved_issues:
    type: array
    items:
      $ref: "#/$defs/UnresolvedIssue"
  review:
    $ref: "#/$defs/Review"
  advisor_incentives:
    type: array
    items:
      $ref: "#/$defs/AdvisorIncentive"
  audit:
    $ref: "#/$defs/Audit"
allOf:
  # G-01 fail-closed: any state after DRAFT proves Clarity Triage passed.
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - CLARIFYING
                - MODELED
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        context:
          properties:
            decision_scope:
              type: string
              minLength: 1
            time_horizon:
              type: string
              minLength: 1
          required:
            - decision_scope
            - stakes
            - reversibility
            - time_horizon
        success_contract:
          properties:
            status:
              enum:
                - draft
                - confirmed
                - superseded
            owner_goal:
              type: object
              properties:
                statement:
                  type: string
                  minLength: 1
              required:
                - statement
            goal_alignment:
              type: object
              properties:
                status:
                  enum:
                    - aligned
                    - partially_aligned
                    - conflicting
                    - no_advisor
                    - unknown
                assessed_at:
                  $ref: "#/$defs/ISODateTime"
              required:
                - status
                - assessed_at
          required:
            - status
            - owner_goal
            - goal_alignment
        clarity_gaps:
          properties:
            triage_status:
              const: ready
            assessed_at:
              $ref: "#/$defs/ISODateTime"
            gate_decision:
              const: full_case
            route_status:
              const: ready_for_transition
            next_state:
              const: CLARIFYING
          required:
            - triage_status
            - assessed_at
            - gate_decision
            - route_status
            - next_state
        audit:
          properties:
            source_manifest:
              minItems: 1
          required:
            - source_manifest
  # G-02 fail-closed: MODELED means Reality Sufficiency passed.
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - MODELED
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        success_contract:
          properties:
            status:
              enum:
                - confirmed
                - superseded
            owner_goal:
              type: object
              properties:
                statement:
                  type: string
                  minLength: 1
                user_confirmed:
                  const: true
                confirmed_at:
                  $ref: "#/$defs/ISODateTime"
                acceptable_costs:
                  minItems: 1
                unacceptable_costs:
                  minItems: 1
              required:
                - statement
                - acceptable_costs
                - unacceptable_costs
                - user_confirmed
                - confirmed_at
            goal_alignment:
              type: object
              properties:
                status:
                  enum:
                    - aligned
                    - partially_aligned
                    - conflicting
                    - no_advisor
                assessed_at:
                  $ref: "#/$defs/ISODateTime"
                owner_acknowledged:
                  const: true
              required:
                - status
                - assessed_at
                - owner_acknowledged
            user_confirmed:
              const: true
            confirmed_at:
              $ref: "#/$defs/ISODateTime"
            desired_outcome:
              type: string
              minLength: 1
            success_criteria:
              minItems: 1
            failure_conditions:
              minItems: 1
            non_goals:
              minItems: 1
          required:
            - status
            - owner_goal
            - goal_alignment
            - desired_outcome
            - success_criteria
            - failure_conditions
            - non_goals
            - user_confirmed
            - confirmed_at
        evidence_ledger:
          minItems: 1
        context:
          properties:
            relationship_temperature_applicability:
              enum:
                - required
                - not_material
            advisor_incentive_applicability:
              enum:
                - required
                - none_identified
            contradiction_assessment:
              enum:
                - none_identified
                - recorded
            critical_issue_disposition:
              enum:
                - none_identified
                - recorded
          required:
            - relationship_temperature_applicability
            - advisor_incentive_applicability
            - contradiction_assessment
            - critical_issue_disposition
        unresolved_issues:
          items:
            allOf:
              - if:
                  properties:
                    impact:
                      enum:
                        - blocker
                        - high
                    status:
                      enum:
                        - open
                        - monitoring
                  required:
                    - impact
                    - status
                then:
                  properties:
                    owner:
                      $ref: "#/$defs/PersonRef"
                    next_action:
                      type: string
                      minLength: 1
                    due_at:
                      $ref: "#/$defs/DateOrDateTime"
                    disposition:
                      enum:
                        - evidence_action
                        - decision_date
                        - accepted_uncertainty
                  required:
                    - owner
                    - next_action
                    - due_at
                    - disposition
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - MODELED
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
        context:
          properties:
            advisor_incentive_applicability:
              const: required
          required:
            - advisor_incentive_applicability
      required:
        - identity
        - context
    then:
      properties:
        advisor_incentives:
          minItems: 1
          items:
            type: object
            properties:
              potential_incentives:
                minItems: 1
              default_goal:
                type: object
                properties:
                  user_validated:
                    const: true
                required:
                  - user_validated
              user_acknowledged:
                const: true
            required:
              - potential_incentives
              - default_goal
              - user_acknowledged
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - MODELED
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
        context:
          properties:
            contradiction_assessment:
              const: recorded
          required:
            - contradiction_assessment
      required:
        - identity
        - context
    then:
      anyOf:
        - properties:
            evidence_ledger:
              contains:
                type: object
                properties:
                  epistemic_status:
                    enum:
                      - contested
                      - refuted
                required:
                  - epistemic_status
              minContains: 1
        - properties:
            unresolved_issues:
              contains:
                type: object
                properties:
                  category:
                    const: hypothesis_conflict
                required:
                  - category
              minContains: 1
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - MODELED
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
        context:
          properties:
            critical_issue_disposition:
              const: recorded
          required:
            - critical_issue_disposition
      required:
        - identity
        - context
    then:
      properties:
        unresolved_issues:
          minItems: 1
  # G-03 fail-closed: DECIDING means the Problem Model passed.
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        problem_model:
          properties:
            status:
              const: confirmed
            symptom:
              type: string
              minLength: 1
            reframed_problem:
              type: string
              minLength: 1
            root_hypothesis_ids:
              minItems: 1
            confirmation_claim_ids:
              minItems: 1
            user_confirmed:
              const: true
            confirmed_at:
              $ref: "#/$defs/ISODateTime"
          required:
            - status
            - symptom
            - reframed_problem
            - root_hypothesis_ids
            - confirmation_claim_ids
            - user_confirmed
            - confirmed_at
        competing_hypotheses:
          minItems: 1
          items:
            type: object
            properties:
              supporting_claim_ids:
                minItems: 1
              predictions:
                minItems: 1
              falsified_when:
                minItems: 1
              diagnostic_action_ids:
                minItems: 1
            required:
              - supporting_claim_ids
              - contradicting_claim_ids
              - predictions
              - falsified_when
              - diagnostic_action_ids
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        competing_hypotheses:
          minItems: 1
        problem_model:
          properties:
            status:
              enum:
                - draft
                - confirmed
                - superseded
            reframed_problem:
              type: string
              minLength: 1
            key_constraint:
              type: string
              minLength: 1
          required:
            - status
            - reframed_problem
            - key_constraint
            - ambiguity_material
            - alternative_exclusion_rationale
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
        problem_model:
          properties:
            ambiguity_material:
              const: true
          required:
            - ambiguity_material
      required:
        - identity
        - problem_model
    then:
      properties:
        competing_hypotheses:
          minItems: 2
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - DECIDING
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
        problem_model:
          properties:
            ambiguity_material:
              const: false
          required:
            - ambiguity_material
      required:
        - identity
        - problem_model
    then:
      properties:
        problem_model:
          properties:
            alternative_exclusion_rationale:
              type: string
              minLength: 1
          required:
            - alternative_exclusion_rationale
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - PLANNED
                - ACTING
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        decision:
          properties:
            status:
              enum:
                - confirmed
                - superseded
            selected_option_id:
              type: string
              minLength: 1
            current_best_judgment:
              type: string
              minLength: 1
            confidence:
              type: number
              minimum: 0
              maximum: 1
            user_confirmed:
              const: true
          required:
            - status
            - selected_option_id
            - current_best_judgment
            - confidence
            - user_confirmed
        action_plan:
          properties:
            status:
              enum:
                - confirmed
                - in_progress
                - completed
                - superseded
            tracks:
              minItems: 1
              contains:
                type: object
                properties:
                  tasks:
                    type: array
                    contains:
                      type: object
                      properties:
                        horizon:
                          const: NOW
                      required:
                        - horizon
                    minContains: 1
                required:
                  - tasks
              minContains: 1
            primary_track_id:
              type: string
              minLength: 1
            next_best_action_id:
              type: string
              minLength: 1
          required:
            - status
            - tracks
            - primary_track_id
            - next_best_action_id
        review:
          properties:
            review_at:
              $ref: "#/$defs/DateOrDateTime"
          required:
            - review_at
        threshold_provenance:
          minItems: 1
        teach_back:
          properties:
            status:
              const: confirmed
            decision_response:
              enum:
                - accepted
                - revised
            user_summary:
              type: string
              minLength: 1
            accuracy:
              const: accurate
            owner_confirmed:
              const: true
            coverage:
              type: object
              properties:
                owner_goal:
                  properties:
                    covered:
                      const: true
                problem:
                  properties:
                    covered:
                      const: true
                chosen_judgment:
                  properties:
                    covered:
                      const: true
                rejected_alternative:
                  properties:
                    covered:
                      const: true
                principal_tradeoff:
                  properties:
                    covered:
                      const: true
                key_thresholds:
                  properties:
                    covered:
                      const: true
                strongest_countercase:
                  properties:
                    covered:
                      const: true
                change_mind_conditions:
                  properties:
                    covered:
                      const: true
          required:
            - status
            - decision_response
            - user_summary
            - accuracy
            - owner_confirmed
            - coverage
  - if:
      properties:
        identity:
          properties:
            status:
              const: ACTING
          required:
            - status
      required:
        - identity
    then:
      properties:
        action_plan:
          properties:
            tracks:
              contains:
                type: object
                properties:
                  status:
                    enum:
                      - ready
                      - in_progress
                  tasks:
                    type: array
                    contains:
                      type: object
                      properties:
                        horizon:
                          const: NOW
                        status:
                          enum:
                            - ready
                            - in_progress
                        start_condition:
                          type: string
                          minLength: 1
                        observation_window:
                          type: string
                          minLength: 1
                        validation_signal_ids:
                          type: array
                          minItems: 1
                        case_owner_accepted:
                          const: true
                        accepted_at:
                          $ref: "#/$defs/ISODateTime"
                      required:
                        - horizon
                        - status
                        - owner
                        - start_condition
                        - observation_window
                        - validation_signal_ids
                        - stop_continue_rule
                        - case_owner_accepted
                        - accepted_at
                    minContains: 1
                required:
                  - status
                  - tasks
              minContains: 1
          required:
            - tracks
        audit:
          properties:
            decision_locked_at:
              $ref: "#/$defs/ISODateTime"
            decision_snapshot_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
          required:
            - decision_locked_at
            - decision_snapshot_sha256
        decision_snapshot:
          properties:
            status:
              const: locked
            snapshot_id:
              type: string
              minLength: 1
            version:
              type: integer
              minimum: 1
            decision_id:
              type: string
              minLength: 1
            judgment:
              type: string
              minLength: 1
            confidence:
              type: number
              minimum: 0
              maximum: 1
            prediction_ids:
              minItems: 1
            active_threshold_versions:
              minItems: 1
            tradeoffs:
              minItems: 1
            now_action_ids:
              minItems: 1
            locked_at:
              $ref: "#/$defs/ISODateTime"
            payload_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
          required:
            - status
            - snapshot_id
            - version
            - decision_id
            - judgment
            - confidence
            - prediction_ids
            - active_threshold_versions
            - tradeoffs
            - now_action_ids
            - locked_at
            - payload_sha256
  # G-06 fail-closed: REVIEW_DUE and later require a comparable observation,
  # but do not require an action to remain ready/in_progress.
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - REVIEW_DUE
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        review:
          properties:
            readiness:
              type: object
              properties:
                status:
                  const: ready
                basis:
                  enum:
                    - attempted
                    - intentionally_not_attempted
                    - blocked
                    - observation_window_elapsed
                observation_claim_ids:
                  minItems: 1
                decision_snapshot_available:
                  const: true
                predictions_available:
                  const: true
                assessed_at:
                  $ref: "#/$defs/ISODateTime"
              required:
                - status
                - basis
                - observation_claim_ids
                - decision_snapshot_available
                - predictions_available
                - assessed_at
          required:
            - readiness
        audit:
          properties:
            decision_locked_at:
              $ref: "#/$defs/ISODateTime"
            decision_snapshot_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
          required:
            - decision_locked_at
            - decision_snapshot_sha256
        decision_snapshot:
          properties:
            status:
              const: locked
          required:
            - status
  - if:
      properties:
        identity:
          properties:
            status:
              enum:
                - REVIEWED
                - ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        review:
          properties:
            status:
              const: completed
            outcome:
              $ref: "#/$defs/Outcome"
            aar:
              allOf:
                - $ref: "#/$defs/AAR"
                - type: object
                  properties:
                    judgment_updates:
                      minItems: 1
                      items:
                        type: object
                        properties:
                          owner_disposition:
                            enum:
                              - confirmed
                              - revised
                              - rejected
                          user_confirmed:
                            const: true
                        required:
                          - owner_disposition
                          - user_confirmed
                  required:
                    - judgment_updates
                    - learning_diagnosis
          required:
            - status
            - outcome
            - aar
  # G-08 fail-closed: ARCHIVED requires explicit closure and disposition of
  # every material unresolved issue. Cross-Case links are validated by the app.
  - if:
      properties:
        identity:
          properties:
            status:
              const: ARCHIVED
          required:
            - status
      required:
        - identity
    then:
      properties:
        unresolved_issues:
          items:
            type: object
            properties:
              status:
                enum:
                  - resolved
                  - accepted_unknown
                  - deferred
              disposition:
                enum:
                  - accepted_uncertainty
                  - carried_forward
                  - resolved
            required:
              - status
              - disposition
        review:
          anyOf:
            - properties:
                next_decision_at:
                  $ref: "#/$defs/DateOrDateTime"
              required:
                - next_decision_at
            - properties:
                closure_reason:
                  type: string
                  minLength: 1
              required:
                - closure_reason

$defs:
  NonEmptyString:
    type: string
    minLength: 1
  NullableString:
    oneOf:
      - $ref: "#/$defs/NonEmptyString"
      - type: "null"
  ISODate:
    type: string
    format: date
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  ISODateTime:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})$"
  NullableDate:
    oneOf:
      - $ref: "#/$defs/ISODate"
      - type: "null"
  NullableDateTime:
    oneOf:
      - $ref: "#/$defs/ISODateTime"
      - type: "null"
  DateOrDateTime:
    anyOf:
      - $ref: "#/$defs/ISODate"
      - $ref: "#/$defs/ISODateTime"
  NullableDateOrDateTime:
    oneOf:
      - $ref: "#/$defs/DateOrDateTime"
      - type: "null"
  Confidence:
    type: number
    minimum: 0
    maximum: 1
  StringList:
    type: array
    items:
      $ref: "#/$defs/NonEmptyString"
    uniqueItems: true
  ClaimType:
    type: string
    enum:
      - observed_fact
      - user_interpretation
      - self_label
      - expert_hypothesis
      - expert_heuristic
      - external_evidence
      - market_signal
      - recommendation
  CaseStatus:
    type: string
    enum:
      - DRAFT
      - CLARIFYING
      - MODELED
      - DECIDING
      - PLANNED
      - ACTING
      - REVIEW_DUE
      - REVIEWED
      - ARCHIVED
  PersonRef:
    type: object
    additionalProperties: false
    required:
      - person_id
      - display_name
      - role
    properties:
      person_id:
        $ref: "#/$defs/NonEmptyString"
      display_name:
        $ref: "#/$defs/NonEmptyString"
      role:
        type: string
        enum:
          - case_owner
          - advisor
          - facilitator
          - evaluator
          - system
          - stakeholder
  CaseOwnerRef:
    description: >-
      A role-constrained reference used wherever final goal, decision, or Gate
      sovereignty belongs to the Case Owner rather than an Advisor or Copilot.
    type: object
    additionalProperties: false
    required:
      - person_id
      - display_name
      - role
    properties:
      person_id:
        $ref: "#/$defs/NonEmptyString"
      display_name:
        $ref: "#/$defs/NonEmptyString"
      role:
        const: case_owner
  SourceLocator:
    type: object
    additionalProperties: false
    required:
      - locator_type
      - value
    properties:
      locator_type:
        type: string
        enum:
          - timestamp
          - line_range
          - page
          - heading
          - paragraph
          - url_fragment
          - record_id
          - event_id
      value:
        $ref: "#/$defs/NonEmptyString"
      verbatim_excerpt:
        $ref: "#/$defs/NullableString"
  SourceRef:
    type: object
    additionalProperties: false
    required:
      - source_id
      - source_type
      - title
      - uri_or_path
      - content_sha256
      - captured_at
