    required:
      - metric
      - value
      - unit
      - measured_at
      - source_claim_ids
    properties:
      metric:
        $ref: "#/$defs/NonEmptyString"
      value:
        oneOf:
          - type: string
            minLength: 1
          - type: number
          - type: boolean
      unit:
        $ref: "#/$defs/NullableString"
      measured_at:
        $ref: "#/$defs/DateOrDateTime"
      source_claim_ids:
        $ref: "#/$defs/StringList"
  Outcome:
    type: object
    additionalProperties: false
    required:
      - recorded_at
      - summary
      - result
      - criterion_results
      - actual_metrics
      - evidence_claim_ids
      - confounders
      - unintended_effects
    properties:
      recorded_at:
        $ref: "#/$defs/ISODateTime"
      summary:
        $ref: "#/$defs/NonEmptyString"
      result:
        type: string
        enum:
          - success
          - adverse
          - mixed
          - inconclusive
          - blocked
          - intentionally_not_attempted
      criterion_results:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/CriterionOutcome"
      actual_metrics:
        type: array
        items:
          $ref: "#/$defs/ActualMetric"
      evidence_claim_ids:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/NonEmptyString"
        uniqueItems: true
      confounders:
        $ref: "#/$defs/StringList"
      unintended_effects:
        $ref: "#/$defs/StringList"
  JudgmentUpdate:
    type: object
    additionalProperties: false
    required:
      - update_id
      - prior_judgment
      - disposition
      - updated_judgment
      - rationale
      - evidence_claim_ids
      - scope_conditions
      - owner_disposition
      - user_confirmed
    properties:
      update_id:
        $ref: "#/$defs/NonEmptyString"
      prior_judgment:
        $ref: "#/$defs/NonEmptyString"
      disposition:
        type: string
        enum:
          - retain
          - modify
          - discard
          - insufficient_evidence
      updated_judgment:
        $ref: "#/$defs/NullableString"
      rationale:
        $ref: "#/$defs/NonEmptyString"
      evidence_claim_ids:
        $ref: "#/$defs/StringList"
      scope_conditions:
        $ref: "#/$defs/StringList"
      owner_disposition:
        description: >-
          Case Owner response to the proposed update. Rejected updates remain in
          history but MUST NOT become cross-Case learned rules.
        type: string
        enum:
          - confirmed
          - revised
          - rejected
      user_confirmed:
        type: boolean
  AAR:
    type: object
    additionalProperties: false
    required:
      - completed_at
      - what_was_expected
      - what_happened
      - what_went_well
      - what_did_not_go_well
      - why_delta
      - controllable_factors
      - uncontrollable_factors
      - prediction_calibration
      - lessons
      - judgment_updates
      - learning_diagnosis
      - next_actions
      - user_confirmed
    properties:
      completed_at:
        $ref: "#/$defs/ISODateTime"
      what_was_expected:
        $ref: "#/$defs/NonEmptyString"
      what_happened:
        $ref: "#/$defs/NonEmptyString"
      what_went_well:
        $ref: "#/$defs/StringList"
      what_did_not_go_well:
        $ref: "#/$defs/StringList"
      why_delta:
        $ref: "#/$defs/NonEmptyString"
      controllable_factors:
        $ref: "#/$defs/StringList"
      uncontrollable_factors:
        $ref: "#/$defs/StringList"
      prediction_calibration:
        type: string
        enum:
          - overconfident
          - underconfident
          - well_calibrated
          - not_assessable
      lessons:
        $ref: "#/$defs/StringList"
      judgment_updates:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/JudgmentUpdate"
      learning_diagnosis:
        $ref: "#/$defs/LearningDiagnosis"
      next_actions:
        $ref: "#/$defs/StringList"
      user_confirmed:
        type: boolean
  LearningDiagnosisDimension:
    type: object
    additionalProperties: false
    required:
      - assessment
      - evidence_claim_ids
    properties:
      assessment:
        $ref: "#/$defs/NonEmptyString"
      evidence_claim_ids:
        $ref: "#/$defs/StringList"
  LearningDiagnosis:
    description: >-
      Separates diagnosis of decision process from outcome valence. A favorable
      outcome cannot erase weak process, and an adverse outcome cannot alone
      prove that the prior judgment was poor.
    type: object
    additionalProperties: false
    required:
      - framing
      - evidence
      - alternatives
      - thresholds
      - commitment
      - execution
      - external_change
      - chance
      - overall_process_quality
      - outcome_valence
      - luck_assessment
    properties:
      framing:
        $ref: "#/$defs/LearningDiagnosisDimension"
      evidence:
        $ref: "#/$defs/LearningDiagnosisDimension"
      alternatives:
        $ref: "#/$defs/LearningDiagnosisDimension"
      thresholds:
        $ref: "#/$defs/LearningDiagnosisDimension"
      commitment:
        $ref: "#/$defs/LearningDiagnosisDimension"
      execution:
        $ref: "#/$defs/LearningDiagnosisDimension"
      external_change:
        $ref: "#/$defs/LearningDiagnosisDimension"
      chance:
        $ref: "#/$defs/LearningDiagnosisDimension"
      overall_process_quality:
        type: string
        enum:
          - strong
          - adequate
          - weak
          - not_assessable
      outcome_valence:
        type: string
        enum:
          - favorable
          - adverse
          - mixed
          - neutral
          - inconclusive
          - not_attempted
      luck_assessment:
        type: string
        enum:
          - materially_helpful
          - somewhat_helpful
          - neutral_or_unknown
          - somewhat_harmful
          - materially_harmful
  ReviewReadiness:
    type: object
    additionalProperties: false
    required:
      - status
      - basis
      - observation_claim_ids
      - decision_snapshot_available
      - predictions_available
      - assessed_at
      - rationale
    properties:
      status:
        type: string
        enum:
          - not_assessed
          - not_ready
          - ready
      basis:
        type: string
        enum:
          - not_assessed
          - attempted
          - intentionally_not_attempted
          - blocked
          - observation_window_elapsed
      observation_claim_ids:
        $ref: "#/$defs/StringList"
      decision_snapshot_available:
        type: boolean
      predictions_available:
        type: boolean
      assessed_at:
        $ref: "#/$defs/NullableDateTime"
      rationale:
        $ref: "#/$defs/NullableString"
  Review:
    type: object
    additionalProperties: false
    required:
      - status
      - readiness
      - review_at
      - started_at
      - completed_at
      - decision_snapshot_version
      - prediction_ids
      - outcome
      - aar
      - evidence_sufficiency
      - missing_evidence
      - next_decision_at
      - closure_reason
    properties:
      status:
        type: string
        enum:
          - not_scheduled
          - scheduled
          - due
          - in_progress
          - completed
          - inconclusive
          - overdue
      readiness:
        $ref: "#/$defs/ReviewReadiness"
      review_at:
        $ref: "#/$defs/NullableDateOrDateTime"
      started_at:
        $ref: "#/$defs/NullableDateTime"
      completed_at:
        $ref: "#/$defs/NullableDateTime"
      decision_snapshot_version:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      prediction_ids:
        $ref: "#/$defs/StringList"
      outcome:
        oneOf:
          - $ref: "#/$defs/Outcome"
          - type: "null"
      aar:
        oneOf:
          - $ref: "#/$defs/AAR"
          - type: "null"
      evidence_sufficiency:
        type: string
        enum:
          - not_assessed
          - sufficient
          - partial
          - insufficient
      missing_evidence:
        $ref: "#/$defs/StringList"
      next_decision_at:
        $ref: "#/$defs/NullableDateOrDateTime"
      closure_reason:
        $ref: "#/$defs/NullableString"
  AdvisorDefaultGoal:
    type: object
    additionalProperties: false
    required:
      - statement
      - basis
      - evidence_claim_ids
      - alignment_with_owner
      - confidence
      - user_validated
    properties:
      statement:
        description: >-
          The objective the advisor appears to optimize by default, such as
          revenue growth, speed, simplicity, client retention, lifestyle, or
          risk reduction. It must not be silently treated as the owner's goal.
        $ref: "#/$defs/NonEmptyString"
      basis:
        type: string
        enum:
          - explicitly_stated
          - inferred_from_advice
          - unknown
      evidence_claim_ids:
        $ref: "#/$defs/StringList"
      alignment_with_owner:
        type: string
        enum:
          - aligned
          - partially_aligned
          - conflicting
          - unknown
      confidence:
        $ref: "#/$defs/Confidence"
      user_validated:
        type: boolean
  AdvisorIncentive:
    type: object
    additionalProperties: false
    required:
      - advisor_incentive_id
      - advisor
      - relationship_to_owner
      - default_goal
      - advice_claim_ids
      - potential_incentives
      - disclosure_status
      - evidence_claim_ids
      - likely_direction_of_bias
      - decision_impact
      - mitigation
      - user_acknowledged
    properties:
      advisor_incentive_id:
        $ref: "#/$defs/NonEmptyString"
      advisor:
        $ref: "#/$defs/PersonRef"
      relationship_to_owner:
        $ref: "#/$defs/NonEmptyString"
      default_goal:
        $ref: "#/$defs/AdvisorDefaultGoal"
      advice_claim_ids:
        $ref: "#/$defs/StringList"
      potential_incentives:
        type: array
        items:
          type: string
          enum:
            - financial_gain
            - course_or_service_sales
            - client_retention
            - referral_benefit
            - reputation_or_status
            - testimonial_or_case_study
            - ideological_commitment
            - time_saving
            - social_affiliation
            - self_validation
            - unknown
            - none_identified
            - other
        uniqueItems: true
      disclosure_status:
        type: string
        enum:
          - disclosed
          - inferred
          - unknown
          - none_identified
      evidence_claim_ids:
        $ref: "#/$defs/StringList"
      likely_direction_of_bias:
        $ref: "#/$defs/NonEmptyString"
      decision_impact:
        type: string
        enum:
          - none
          - low
          - medium
          - high
          - unknown
      mitigation:
        $ref: "#/$defs/StringList"
      user_acknowledged:
        type: boolean
  StateTransition:
    $comment: >-
      Each record validates an allowed edge. The application validator MUST
      sort by occurred_at/version, require from to equal the prior to/current
      state, require the named Gate evidence, and prevent transitions after
      ARCHIVED except by an explicitly linked new Case/version.
    type: object
    additionalProperties: false
    required:
      - transition
      - from
      - to
      - gate_id
      - occurred_at
      - actor
      - reason
      - version
    properties:
      transition:
        type: string
        enum:
          - CREATE_TO_DRAFT
          - DRAFT_TO_CLARIFYING
          - CLARIFYING_TO_DRAFT
          - CLARIFYING_TO_MODELED
          - MODELED_TO_CLARIFYING
          - MODELED_TO_DECIDING
          - DECIDING_TO_CLARIFYING
          - DECIDING_TO_MODELED
          - DECIDING_TO_PLANNED
          - PLANNED_TO_DECIDING
          - PLANNED_TO_ACTING
          - ACTING_TO_REVIEW_DUE
          - REVIEW_DUE_TO_ACTING
          - REVIEW_DUE_TO_REVIEWED
          - REVIEWED_TO_CLARIFYING
          - REVIEWED_TO_ARCHIVED
      from:
        oneOf:
          - $ref: "#/$defs/CaseStatus"
          - type: "null"
      to:
        $ref: "#/$defs/CaseStatus"
      gate_id:
        description: >-
          Gate record authorizing this edge. Null is allowed only for initial
          Case creation; the application validator verifies Gate evidence and
          correspondence to the named transition.
        $ref: "#/$defs/NullableString"
      occurred_at:
        $ref: "#/$defs/ISODateTime"
      actor:
        $ref: "#/$defs/PersonRef"
      reason:
        $ref: "#/$defs/NonEmptyString"
      version:
        type: integer
        minimum: 1
    oneOf:
      - properties:
          transition: {const: CREATE_TO_DRAFT}
          from: {type: "null"}
          to: {const: DRAFT}
          gate_id: {type: "null"}
      - properties:
          transition: {const: DRAFT_TO_CLARIFYING}
          from: {const: DRAFT}
          to: {const: CLARIFYING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: CLARIFYING_TO_DRAFT}
          from: {const: CLARIFYING}
          to: {const: DRAFT}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: CLARIFYING_TO_MODELED}
          from: {const: CLARIFYING}
          to: {const: MODELED}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: MODELED_TO_CLARIFYING}
          from: {const: MODELED}
          to: {const: CLARIFYING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: MODELED_TO_DECIDING}
          from: {const: MODELED}
          to: {const: DECIDING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: DECIDING_TO_CLARIFYING}
          from: {const: DECIDING}
          to: {const: CLARIFYING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: DECIDING_TO_MODELED}
          from: {const: DECIDING}
          to: {const: MODELED}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: DECIDING_TO_PLANNED}
          from: {const: DECIDING}
          to: {const: PLANNED}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: PLANNED_TO_DECIDING}
          from: {const: PLANNED}
          to: {const: DECIDING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: PLANNED_TO_ACTING}
          from: {const: PLANNED}
          to: {const: ACTING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: ACTING_TO_REVIEW_DUE}
          from: {const: ACTING}
          to: {const: REVIEW_DUE}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: REVIEW_DUE_TO_ACTING}
          from: {const: REVIEW_DUE}
          to: {const: ACTING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: REVIEW_DUE_TO_REVIEWED}
          from: {const: REVIEW_DUE}
          to: {const: REVIEWED}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: REVIEWED_TO_CLARIFYING}
          from: {const: REVIEWED}
          to: {const: CLARIFYING}
          gate_id: {type: string, minLength: 1}
      - properties:
          transition: {const: REVIEWED_TO_ARCHIVED}
          from: {const: REVIEWED}
          to: {const: ARCHIVED}
          gate_id: {type: string, minLength: 1}
  AuditEvent:
    type: object
    additionalProperties: false
    required:
      - event_id
      - event_type
      - occurred_at
      - actor
      - summary
      - affected_paths
    properties:
      event_id:
        $ref: "#/$defs/NonEmptyString"
      event_type:
        type: string
        enum:
          - case_created
          - claim_added
          - claim_corrected
          - hypothesis_updated
          - gate_passed
          - gate_reopened
          - decision_confirmed
          - decision_superseded
          - action_updated
          - outcome_recorded
          - aar_completed
          - case_archived
      occurred_at:
        $ref: "#/$defs/ISODateTime"
      actor:
        $ref: "#/$defs/PersonRef"
      summary:
        $ref: "#/$defs/NonEmptyString"
      affected_paths:
        $ref: "#/$defs/StringList"
  Audit:
    type: object
    additionalProperties: false
    required:
      - source_manifest
      - state_transitions
      - events
      - decision_locked_at
      - decision_snapshot_sha256
      - last_validated_at
      - validator_version
    properties:
      source_manifest:
        type: array
        items:
          $ref: "#/$defs/SourceRef"
      state_transitions:
        type: array
        items:
          $ref: "#/$defs/StateTransition"
      events:
        type: array
        items:
          $ref: "#/$defs/AuditEvent"
      decision_locked_at:
        $ref: "#/$defs/NullableDateTime"
      decision_snapshot_sha256:
        oneOf:
          - type: string
            pattern: "^[a-f0-9]{64}$"
          - type: "null"
      last_validated_at:
        $ref: "#/$defs/NullableDateTime"
      validator_version:
        $ref: "#/$defs/NonEmptyString"
