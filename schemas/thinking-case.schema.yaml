          - accurate
          - partially_accurate
          - inaccurate
      semantic_assessment_method:
        type: string
        enum:
          - not_assessed
          - human_review
          - rule_based
          - model_assisted_human_review
      coverage:
        $ref: "#/$defs/TeachBackCoverage"
      corrections:
        type: array
        items:
          $ref: "#/$defs/TeachBackCorrection"
      referenced_claim_ids:
        $ref: "#/$defs/StringList"
      owner_confirmed:
        type: boolean
      unresolved:
        $ref: "#/$defs/StringList"
