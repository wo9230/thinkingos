      evidence_form:
        description: >-
          How the evidence exists independently of what epistemic role the
          claim plays. For example, expert_hypothesis may be testimony while an
          observed_fact may be a document or direct observation.
        type: string
        enum:
          - testimony
          - document
          - system_record
          - direct_observation
          - experiment_result
          - estimate
          - inference
          - synthesis
      statement:
        $ref: "#/$defs/NonEmptyString"
